const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

function log(msg, cls="") {
  const el = document.getElementById("log");
  el.innerHTML += `<span class="${cls}">${msg}</span>\n`;
  el.scrollTop = el.scrollHeight;
}

window.run = async function () {
  const btn = document.getElementById("btn");
  btn.disabled = true;
  btn.textContent = "Importing…";
  log("Signing in…");
  try {
    await signInWithEmailAndPassword(auth, OWNER_EMAIL, OWNER_PIN);
    log("✓ Signed in", "ok");
  } catch (e) {
    log("✗ Sign in failed: " + e.message, "err");
    btn.disabled = false; return;
  }

  let ok = 0, fail = 0;
  for (const t of transactions) {
    try {
      await addDoc(collection(db, "entries"), {
        ticker: t.ticker,
        action: t.action,
        price:  t.price,
        qty:    t.qty,
        date:   t.date,
        note:   "",
      });
      log(`✓ ${t.date} ${t.action.toUpperCase()} ${t.ticker} ${t.qty} @ ${t.price}`, "ok");
      ok++;
    } catch (e) {
      log(`✗ ${t.ticker} ${t.date}: ${e.message}`, "err");
      fail++;
    }
    await new Promise(r => setTimeout(r, 80)); // throttle
  }
  log(`\nDone: ${ok} imported, ${fail} failed`);
  btn.textContent = "Done";
};
