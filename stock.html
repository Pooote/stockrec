<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stock Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin:0; background:#09090b; color:#e4e4e7; font-family:'Inter',sans-serif; font-size:15px; line-height:1.5; padding:28px 20px; }
  .wrap { max-width:660px; margin:0 auto; }
  h1 { font-size:26px; font-weight:700; letter-spacing:-0.5px; margin:0 0 4px; }
  .sub { color:#71717a; font-size:14px; margin:0 0 28px; }
  .card { background:#111113; border:1px solid #27272a; border-radius:14px; padding:18px; margin-bottom:24px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px; }
  input, select { background:#09090b; border:1px solid #27272a; border-radius:9px; padding:9px 12px; font-size:14px; font-family:'Inter',sans-serif; color:#e4e4e7; width:100%; transition:border-color .15s; }
  input:focus, select:focus { outline:none; border-color:#6366f1; box-shadow:0 0 0 3px rgba(99,102,241,.15); }
  input::placeholder { color:#52525b; }
  button.primary { display:inline-flex; align-items:center; gap:6px; background:#6366f1; color:#fff; border:none; border-radius:9px; padding:9px 16px; font-size:14px; font-family:'Inter',sans-serif; font-weight:600; cursor:pointer; transition:background .15s; }
  button.primary:hover { background:#818cf8; }
  button.primary:disabled { opacity:.45; cursor:not-allowed; }
  .filter { width:100%; margin-bottom:18px; }
  .empty { color:#52525b; font-size:14px; padding:12px 0; }
  .error { display:flex; align-items:center; gap:8px; background:#3f0e18; border:1px solid #7f1d1d; color:#fca5a5; font-size:13.5px; border-radius:10px; padding:10px 14px; margin-bottom:18px; }

  #loginScreen { max-width:300px; margin:120px auto; text-align:center; }
  #loginScreen h1 { margin-bottom:6px; }
  #loginScreen .sub { margin-bottom:28px; }
  #loginScreen input { margin:0 0 12px; text-align:center; letter-spacing:6px; font-size:22px; padding:12px; }
  #loginScreen p.err { color:#f87171; font-size:13px; min-height:20px; margin-top:8px; }
  #app { display:none; }
  #topbar { display:flex; justify-content:flex-end; margin-bottom:4px; }
  #logoutBtn { background:none; border:none; color:#52525b; font-size:13px; font-family:'Inter',sans-serif; cursor:pointer; padding:4px 0; }
  #logoutBtn:hover { color:#a1a1aa; }

  .group { border-bottom:1px solid #1f1f23; }
  .group:first-child { border-top:1px solid #1f1f23; }
  .grow { display:flex; align-items:center; gap:14px; padding:14px 4px; cursor:pointer; user-select:none; }
  .grow:hover { background:#0d0d10; }
  .badge { flex-shrink:0; width:48px; height:34px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; color:#fff; letter-spacing:.5px; }
  .name { flex:1; min-width:0; }
  .name .t { font-weight:700; font-size:15px; letter-spacing:-0.2px; }
  .name .qty { color:#71717a; font-size:12.5px; margin-top:2px; }
  .day-change.pos { color:#34d399; } .day-change.neg { color:#f87171; } .day-change.flat { color:#52525b; }
  .port-bar-wrap { height:3px; background:#1f1f23; border-radius:2px; margin-top:5px; width:100%; }
  .port-bar { height:3px; border-radius:2px; background:#6366f1; transition:width .3s; }
  .port-pct { font-size:11px; color:#6366f1; font-weight:600; margin-top:2px; }
  .price { width:90px; text-align:right; font-size:15px; font-weight:600; font-variant-numeric:tabular-nums; }
  .change { width:82px; text-align:right; font-size:13.5px; font-variant-numeric:tabular-nums; }
  .change.pos { color:#34d399; } .change.neg { color:#f87171; } .change.flat { color:#52525b; }
  .pct { text-align:right; flex-shrink:0; }
  .pct span { display:inline-block; font-size:12px; font-weight:700; padding:4px 8px; border-radius:6px; font-variant-numeric:tabular-nums; white-space:nowrap; line-height:1.4; }
  .pct.pos span { background:rgba(52,211,153,.12); color:#34d399; }
  .pct.neg span { background:rgba(248,113,113,.12); color:#f87171; }
  .pct.flat span { background:#1f1f23; color:#71717a; }
  .chev { width:16px; color:#3f3f46; font-size:11px; transition:transform .2s; flex-shrink:0; }
  .chev.open { transform:rotate(90deg); }

  .details { padding:2px 4px 16px 62px; }
  .setprice { display:flex; align-items:center; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
  .setprice input { width:116px; font-size:13.5px; }
  .setprice button { background:#1f1f23; border:1px solid #3f3f46; color:#a1a1aa; border-radius:8px; padding:7px 11px; font-size:12.5px; font-family:'Inter',sans-serif; cursor:pointer; transition:background .12s; }
  .setprice button:hover { background:#27272a; }
  .setprice button:disabled { opacity:.4; cursor:not-allowed; }
  .setprice label { font-size:12.5px; color:#71717a; }
  .fetch-err { font-size:12px; color:#f87171; width:100%; }

  .txn { display:flex; align-items:flex-start; justify-content:space-between; padding:9px 0; border-top:1px solid #1f1f23; gap:8px; }
  .txn:first-of-type { border-top:none; }
  .txn-left { font-size:13.5px; flex:1; line-height:1.6; }
  .txn-profit { font-size:12px; font-weight:600; margin-left:6px; }
  .txn-profit.pos { color:#34d399; } .txn-profit.neg { color:#f87171; }
  .txn-actions { display:flex; gap:0; flex-shrink:0; margin-top:1px; }
  .txn-edit, .del { background:none; border:none; color:#3f3f46; cursor:pointer; font-size:13px; padding:2px 6px; transition:color .12s; }
  .txn-edit:hover { color:#a1a1aa; }
  .del:hover { color:#f87171; }
  .txn-form { margin-top:8px; display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .txn-form input, .txn-form select { font-size:13px; padding:7px 10px; }
  .txn-form-btns { grid-column:span 2; display:flex; gap:8px; }
  .txn-form-btns button { font-size:13px; font-family:'Inter',sans-serif; font-weight:600; padding:7px 14px; border-radius:8px; border:none; cursor:pointer; transition:background .12s; }
  .btn-save { background:#6366f1; color:#fff; }
  .btn-save:hover { background:#818cf8; }
  .btn-cancel { background:#1f1f23; color:#a1a1aa; border:1px solid #3f3f46 !important; }
  .btn-cancel:hover { background:#27272a; }
  .tag { font-size:11px; font-weight:700; padding:2px 7px; border-radius:5px; margin-right:7px; letter-spacing:.3px; text-transform:uppercase; }
  .tag.buy { background:rgba(52,211,153,.12); color:#34d399; }
  .tag.sell { background:rgba(248,113,113,.12); color:#f87171; }
  .tag.watch { background:rgba(251,191,36,.1); color:#fbbf24; }
  .txn-meta { color:#71717a; }
</style>
</head>
<body>

<div id="loginScreen">
  <h1>Stock Journal</h1>
  <p class="sub">Enter your PIN to continue</p>
  <input id="pw" type="password" inputmode="numeric" placeholder="••••" onkeydown="if(event.key==='Enter')login()">
  <button class="primary" style="width:100%" onclick="login()" id="loginBtn">Log in</button>
  <p class="err" id="loginErr"></p>
</div>

<div id="app" class="wrap">
  <div id="topbar"><button id="logoutBtn" onclick="logout()">Log out</button></div>
  <h1>Stock Journal</h1>
  <p class="sub">Track your buys, sells, and watchlist — synced across devices</p>

  <div id="errorBanner" class="error" style="display:none;">Save failed. Check your internet connection.</div>

  <div class="card">
    <div class="grid">
      <input id="f-ticker" placeholder="Ticker, e.g. PTT">
      <select id="f-action">
        <option value="buy">Buy</option>
        <option value="sell">Sell</option>
        <option value="watch">Watch</option>
      </select>
      <input id="f-price" type="number" placeholder="Price">
      <input id="f-qty" type="number" placeholder="Quantity">
      <input id="f-date" type="date">
      <input id="f-note" placeholder="Note (optional)">
    </div>
    <button class="primary" onclick="addEntry()">+ Add entry</button>
  </div>

  <input class="filter" id="filter" placeholder="Search ticker..." oninput="render()">
  <div id="list"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import {
  getFirestore, collection, doc, addDoc, deleteDoc, setDoc, updateDoc,
  onSnapshot, query
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// === Replace with your values from Firebase Console > Project settings > Your apps ===
const firebaseConfig = {
  apiKey: "AIzaSyAi3cy0ueunppSDCDGSyKj7X72kO3NtRTE",
  authDomain: "stock-record-6925a.firebaseapp.com",
  projectId: "stock-record-6925a",
  storageBucket: "stock-record-6925a.firebasestorage.app",
  messagingSenderId: "495239740483",
  appId: "1:495239740483:web:ab9546d55c937dc6ece8f6"
};
const OWNER_EMAIL = "araikordai@mail.com";
// ==================================================================================

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const LABELS = { buy: "Buy", sell: "Sell", watch: "Watch" };
const PALETTE = ["#18181b","#991b1b","#1d4ed8","#0f766e","#7c3aed","#a16207","#374151","#be185d","#065f46"];

let entries = [], prices = {}, expanded = new Set(), editingId = null;
let unsubEntries = null, unsubPrices = null;

document.getElementById("f-date").value = new Date().toISOString().slice(0,10);

window.login = async function () {
  const pw = document.getElementById("pw").value;
  const btn = document.getElementById("loginBtn");
  const err = document.getElementById("loginErr");
  err.textContent = ""; btn.disabled = true;
  try { await signInWithEmailAndPassword(auth, OWNER_EMAIL, pw); }
  catch { err.textContent = "Wrong PIN or connection failed."; }
  finally { btn.disabled = false; }
};
window.logout = function () { signOut(auth); };

onAuthStateChanged(auth, (user) => {
  if (user) {
    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("app").style.display = "block";
    subscribe();
  } else {
    document.getElementById("loginScreen").style.display = "block";
    document.getElementById("app").style.display = "none";
    if (unsubEntries) unsubEntries();
    if (unsubPrices) unsubPrices();
  }
});

function subscribe() {
  unsubEntries = onSnapshot(query(collection(db, "entries")), (snap) => {
    entries = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    setError(false); render();
  }, () => setError(true));
  unsubPrices = onSnapshot(query(collection(db, "prices")), (snap) => {
    prices = {};
    snap.docs.forEach(d => { prices[d.id] = { price: d.data().price, previousClose: d.data().previousClose ?? null }; });
    render();
  }, () => setError(true));
}

function setError(v) { document.getElementById("errorBanner").style.display = v ? "flex" : "none"; }

window.addEntry = async function () {
  const ticker = document.getElementById("f-ticker").value.trim().toUpperCase();
  const action = document.getElementById("f-action").value;
  const price = parseFloat(document.getElementById("f-price").value);
  const qty = parseFloat(document.getElementById("f-qty").value);
  const date = document.getElementById("f-date").value;
  const note = document.getElementById("f-note").value.trim();
  if (!ticker || isNaN(price) || isNaN(qty)) return;
  try { await addDoc(collection(db, "entries"), { ticker, action, price, qty, date, note }); setError(false); }
  catch { setError(true); return; }
  ["f-ticker","f-price","f-qty","f-note"].forEach(id => document.getElementById(id).value = "");
};

window.deleteEntry = async function (id) {
  try { await deleteDoc(doc(db, "entries", id)); setError(false); } catch { setError(true); }
};

window.fetchPrice = async function (ticker) {
  const btn = document.querySelector(`#sp-${CSS.escape(ticker)} button`);
  const errEl = document.getElementById(`fe-${ticker}`);
  const input = document.getElementById(`cp-${ticker}`);
  errEl.textContent = ""; btn.disabled = true; btn.textContent = "…";
  try {
    const res = await fetch(`/api/price?ticker=${encodeURIComponent(ticker)}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Fetch failed");
    input.value = data.price;
    await persistPrice(ticker, data.price, data.previousClose ?? null);
  } catch (e) { errEl.textContent = e.message; }
  finally { btn.disabled = false; btn.textContent = "↻ Fetch"; }
};

window.savePrice = async function (ticker) {
  const val = parseFloat(document.getElementById(`cp-${ticker}`).value);
  if (!isNaN(val)) await persistPrice(ticker, val, null);
};

async function persistPrice(ticker, val, previousClose) {
  try {
    const payload = { price: val };
    if (previousClose !== null) payload.previousClose = previousClose;
    await setDoc(doc(db, "prices", ticker), payload, { merge: true });
    setError(false);
  } catch { setError(true); }
}

window.toggle = function (ticker) {
  if (expanded.has(ticker)) expanded.delete(ticker); else expanded.add(ticker);
  render();
};

function colorFor(ticker) {
  let h = 0;
  for (let i = 0; i < ticker.length; i++) h = (h * 31 + ticker.charCodeAt(i)) >>> 0;
  return ["#18181b","#991b1b","#1d4ed8","#0f766e","#7c3aed","#a16207","#374151","#be185d","#065f46"][h % 9];
}

function groupByTicker(list) {
  const map = {};
  for (const e of list) { if (!map[e.ticker]) map[e.ticker] = []; map[e.ticker].push(e); }
  return map;
}

window.editEntry = function (id) { editingId = id; render(); };
window.cancelEdit = function () { editingId = null; render(); };
window.saveEdit = async function (id) {
  const action = document.getElementById(`e-action-${id}`).value;
  const price = parseFloat(document.getElementById(`e-price-${id}`).value);
  const qty = parseFloat(document.getElementById(`e-qty-${id}`).value);
  const date = document.getElementById(`e-date-${id}`).value;
  const note = document.getElementById(`e-note-${id}`).value.trim();
  if (isNaN(price) || isNaN(qty)) return;
  try { await updateDoc(doc(db, "entries", id), { action, price, qty, date, note }); setError(false); }
  catch { setError(true); }
  editingId = null; render();
};

function render() {
  const filterVal = document.getElementById("filter").value.trim().toUpperCase();
  const groups = groupByTicker(entries.filter(e => e.ticker.includes(filterVal)));
  const tickers = Object.keys(groups).sort();
  const list = document.getElementById("list");
  if (tickers.length === 0) { list.innerHTML = '<p class="empty">No entries yet.</p>'; return; }

  // คำนวณ total portfolio value สำหรับ % สัดส่วน
  const totalPortValue = tickers.reduce((sum, t) => {
    const grp = groups[t];
    const bQty = grp.filter(x => x.action==="buy").reduce((s,x) => s+x.qty, 0);
    const sQty = grp.filter(x => x.action==="sell").reduce((s,x) => s+x.qty, 0);
    const held = bQty - sQty;
    const p = prices[t]?.price;
    return sum + (p && held > 0 ? held * p : 0);
  }, 0);

  list.innerHTML = tickers.map(ticker => {
    const txns = groups[ticker].slice().sort((a,b) => b.date.localeCompare(a.date));
    const buyQty   = txns.filter(t => t.action==="buy").reduce((s,t) => s+t.qty, 0);
    const buyValue = txns.filter(t => t.action==="buy").reduce((s,t) => s+t.qty*t.price, 0);
    const sellQty  = txns.filter(t => t.action==="sell").reduce((s,t) => s+t.qty, 0);
    const heldQty  = buyQty - sellQty;
    const avgBuy   = buyQty > 0 ? buyValue / buyQty : 0;
    const cur = prices[ticker]?.price;
    const prevClose = prices[ticker]?.previousClose ?? null;
    const has = cur !== undefined && !isNaN(cur);
    const chgAbs = has && avgBuy > 0 ? cur - avgBuy : null;
    const chgPct = chgAbs !== null && avgBuy > 0 ? (chgAbs/avgBuy)*100 : null;
    const trend  = chgAbs === null ? "flat" : chgAbs > 0 ? "pos" : chgAbs < 0 ? "neg" : "flat";

    const dayAbs = has && prevClose ? cur - prevClose : null;
    const dayPct = dayAbs !== null && prevClose ? (dayAbs/prevClose)*100 : null;
    const dayTrend = dayAbs === null ? "flat" : dayAbs > 0 ? "pos" : dayAbs < 0 ? "neg" : "flat";
    const dayHtml = dayAbs !== null
      ? `<span class="day-change ${dayTrend}" style="font-size:12.5px;font-weight:600;">1D ${dayAbs>=0?"+":""}${dayAbs.toLocaleString(undefined,{maximumFractionDigits:2})} (${dayPct>=0?"+":""}${dayPct.toFixed(2)}%)</span>`
      : "";

    const portValue = has && heldQty > 0 ? heldQty * cur : 0;
    const portWeight = totalPortValue > 0 && portValue > 0 ? (portValue / totalPortValue) * 100 : null;
    const portHtml = portWeight !== null
      ? `<div class="port-bar-wrap"><div class="port-bar" style="width:${Math.min(portWeight,100).toFixed(1)}%"></div></div>
         <div class="port-pct">${portWeight.toFixed(1)}% of portfolio</div>`
      : "";
    const isOpen = expanded.has(ticker);

    return `
      <div class="group">
        <div class="grow" onclick="toggle('${ticker}')">
          <div class="badge" style="background:${colorFor(ticker)}">${ticker.slice(0,4)}</div>
          <div class="name">
            <div class="t">${ticker}</div>
            <div class="qty">Holding ${heldQty.toLocaleString()} shares${avgBuy ? " · avg cost " + avgBuy.toLocaleString(undefined,{maximumFractionDigits:2}) : ""}</div>
            ${dayHtml ? `<div>${dayHtml}</div>` : ""}
            ${portHtml}
          </div>
          <div class="price">${has ? cur.toLocaleString() : "—"}</div>
          <div class="change ${trend}">${chgAbs===null ? "" : (chgAbs>=0?"+":"")+chgAbs.toLocaleString(undefined,{maximumFractionDigits:2})}</div>
          <div class="pct ${trend}">${chgPct===null ? "" : `<span>${chgPct>=0?"↑":"↓"} ${Math.abs(chgPct).toFixed(2)}%</span>`}</div>
          <div class="chev ${isOpen?"open":""}">▶</div>
        </div>
        ${isOpen ? `
        <div class="details">
          <div class="setprice" id="sp-${ticker}">
            <label>Current price</label>
            <input id="cp-${ticker}" type="number" value="${has ? cur : ""}" placeholder="Manual">
            <button onclick="fetchPrice('${ticker}')">↻ Fetch</button>
            <button onclick="savePrice('${ticker}')">Save</button>
            <span class="fetch-err" id="fe-${ticker}"></span>
          </div>
          ${txns.map(t => {
            let profit = "";
            if (t.action==="buy" && has && t.price>0) {
              const pAbs = (cur-t.price)*t.qty;
              const pPct = ((cur-t.price)/t.price)*100;
              profit = `<span class="txn-profit ${pAbs>=0?"pos":"neg"}">${pAbs>=0?"+":""}${pAbs.toLocaleString(undefined,{maximumFractionDigits:2})} (${pPct>=0?"+":""}${pPct.toFixed(2)}%)</span>`;
            }
            if (editingId === t.id) return `
              <div class="txn"><div class="txn-left" style="width:100%">
                <div class="txn-form">
                  <select id="e-action-${t.id}">
                    <option value="buy" ${t.action==="buy"?"selected":""}>Buy</option>
                    <option value="sell" ${t.action==="sell"?"selected":""}>Sell</option>
                    <option value="watch" ${t.action==="watch"?"selected":""}>Watch</option>
                  </select>
                  <input id="e-date-${t.id}" type="date" value="${t.date}">
                  <input id="e-price-${t.id}" type="number" placeholder="Price" value="${t.price}">
                  <input id="e-qty-${t.id}" type="number" placeholder="Quantity" value="${t.qty}">
                  <input id="e-note-${t.id}" placeholder="Note (optional)" value="${t.note||""}" style="grid-column:span 2">
                  <div class="txn-form-btns">
                    <button class="btn-save" onclick="saveEdit('${t.id}')">Save</button>
                    <button class="btn-cancel" onclick="cancelEdit()">Cancel</button>
                  </div>
                </div>
              </div></div>`;
            return `
            <div class="txn">
              <div class="txn-left">
                <span class="tag ${t.action}">${LABELS[t.action]}</span>
                <span>${t.qty.toLocaleString()} shares @ ${t.price.toLocaleString()} · ${t.date}${t.note?" · "+t.note:""}</span>
                ${profit}
              </div>
              <div class="txn-actions">
                <button class="txn-edit" onclick="editEntry('${t.id}')">✎</button>
                <button class="del" onclick="deleteEntry('${t.id}')">✕</button>
              </div>
            </div>`;
          }).join("")}
        </div>` : ""}
      </div>`;
  }).join("");
}
</script>
</body>
</html>
